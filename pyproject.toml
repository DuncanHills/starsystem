[project]
name = "starsystem"
version = "2.0.0"
description = "Sync your starred songs from a Subsonic/OpenSubsonic server to a local directory."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Crane" }]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "requests>=2.32",
]

[project.scripts]
starsystem = "starsystem.cli:main"

[project.urls]
Homepage = "https://github.com/DuncanHills/starsystem"

[dependency-groups]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
